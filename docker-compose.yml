# =============================================================================
# POC Activación de Servicios — Fase 1 (Infraestructura + servicios NestJS)
# =============================================================================
# Levanta:
#   kafka                → broker único en modo KRaft (broker + controller)
#   kafka-init           → container de un solo uso: crea los topics y termina
#   kafka-ui             → UI en localhost:8080 para inspeccionar topics
#   mongo                → replica set de 1 nodo (una base por servicio)
#   mongo-init           → job que inicializa el replica set hasta tener PRIMARY
#   mailpit              → bandeja de correo simulada (SMTP 1025, UI 8025)
#   activation-api       → REST + agregador de la saga (puerto 3000)
#   billing-service      → consume ActivationRequested y crea la cuenta
#   provisioning-service → consume ActivationRequested y aprovisiona la línea
#   notification-service → consume activation.events y manda el email
#
# Uso: docker compose up -d --build
# =============================================================================

name: activation-poc

services:
  # ---------------------------------------------------------------------------
  # 1. KAFKA (broker único, KRaft)
  # ---------------------------------------------------------------------------
  # La imagen apache/kafka funciona por variables de entorno: el prefijo KAFKA_
  # se convierte en propiedades de server.properties (regla oficial:
  #   punto → _  ·  guion bajo → __  ·  guion → ___  ·  prefijo KAFKA_
  # IMPORTANTE: si se configura TODO por env, hay que pasar todas las
  # propiedades requeridas por KRaft, si no el broker no arranca.
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.3.1        # versión fijada (última estable) — nada de :latest
    hostname: kafka                  # hostname estable: es como lo van a resolver los demás containers
    container_name: kafka
    ports:
      - "9092:9092"                  # solo el listener EXTERNAL se publica hacia la host
    environment:
      # --- KRaft: quién es el controller (ver bloque de listeners abajo) ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"   # un solo nodo que hace las dos tareas
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"   # "el voto 1 está en kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"     # qué listener es el del protocolo de control
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"       # id del cluster (el del ejemplo oficial de Kafka)

      # --- Los DOS listeners (el punto más enredado de Kafka en Docker) ---
      # KAFKA_LISTENERS          = en QUÉ puertos escucha este broker (bind)
      # KAFKA_ADVERTISED_LISTENERS = qué dirección le devuelve a cada cliente
      #                            cuando pide metadata ("conectate acá")
      #   EXTERNAL → localhost:9092  → clientes desde la host (tu consola, tu app local)
      #   INTERNAL → kafka:19092     → containers entre sí (servicios, kafka-ui, kafka-init)
      # Si solo hubiera uno, o los containers o la host no podrían conectarse.
      KAFKA_LISTENERS: "CONTROLLER://:29093,EXTERNAL://:9092,INTERNAL://:19092"
      KAFKA_ADVERTISED_LISTENERS: "EXTERNAL://localhost:9092,INTERNAL://kafka:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"   # los brokers hablan entre sí por este listener

      # --- Réplicas: con 1 broker, todo lo que Kafka replica por default en 3 hay que bajarlo a 1 ---
      # (si no, topics internos como __consumer_offsets o el transaction state log no arrancarían)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0       # 0 ms de espera inicial → rebalanceos más rápidos (demo)
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

      # --- Política de la casa ---
      # Los topics se crean a propósito en kafka-init. Si un servicio escribe un
      # topic que no existe (typo), preferimos que falle ruidosamente a que Kafka
      # cree un topic "fantasma" de 1 partición que rompe la demo en silencio.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"      # sin volume: `docker compose down` = estado limpio para la demo
    healthcheck:
      # No es un ping: kafka-broker-api-versions.sh habla el protocolo real de Kafka
      # contra el listener EXTERNAL (que en la host del container escucha en :9092).
      # Ruta absoluta: /opt/kafka/bin NO está en el $PATH de la imagen.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s                # Kafka tarda ~10-15 s en formar el quórum; le damos margen

  # ---------------------------------------------------------------------------
  # 2. KAFKA-INIT (crea los topics, una sola vez)
  # ---------------------------------------------------------------------------
  # Usa la MISMA imagen de Kafka (trae kafka-topics.sh) pero no corre el broker:
  # entra, crea los topics y termina. Es el patrón "job" de Compose.
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy    # ← la mitigación del riesgo #1 del doc:
                                      #   no arranca hasta que el broker responde de verdad
    volumes:
      - ./docker/create-topics.sh:/create-topics.sh:ro   # montado solo lectura
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: "no"                     # es un job: termina y no vuelve a correr

  # ---------------------------------------------------------------------------
  # 3. KAFKA UI (inspección visual — la "pantalla derecha" de la demo)
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0     # versión fijada
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      # La UI es otro cliente más: se conecta por el listener INTERNAL (kafka:19092)
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # 4. MAILPIT (bandeja de correo simulada)
  # ---------------------------------------------------------------------------
  # La spec pide Mailhog, pero está sin mantenimiento desde 2020. Mailpit es un
  # reemplazo compatible: mismo SMTP en 1025 y misma UI en 8025, con imagen
  # multi-arquitectura y API estable (/api/v1/messages) para el smoke.
  # La imagen ya trae su propio HEALTHCHECK (/mailpit readyz).
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.34.0
    container_name: mailpit
    ports:
      - "1025:1025"                  # SMTP: acá se conecta notification-service
      - "8025:8025"                  # UI web: la "bandeja de entrada" de la demo
    environment:
      MP_MAX_MESSAGES: 5000          # sin volume: `docker compose down` limpia todo
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 5. MONGO (base de datos en replica set de 1 nodo)
  # ---------------------------------------------------------------------------
  # ¿Por qué un replica set si hay un solo nodo? Porque Mongo NO permite
  # transacciones multi-documento en modo standalone, y la POC las necesita
  # para el outbox y la idempotencia (sección 09 del documento). Un replica
  # set de 1 nodo es el mínimo para desbloquearlas: NO es alta disponibilidad.
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:8.0.32              # versión fijada (serie 8.0 consolidada)
    container_name: mongo
    ports:
      - "27017:27017"
    # --replSet rs0: arranca como miembro del replica set "rs0", pero SIN
    # inicializarlo todavía: eso lo hace mongo-init con rs.initiate()
    # --bind_ip_all: escucha en todas las interfaces del container
    #   (por defecto solo escucha en 127.0.0.1 y nadie podría conectarse)
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      # "¿responde?" — ojo: esto NO garantiza que haya un PRIMARY electo,
      # solo que el proceso escucha. Quien necesite un primario debe esperar
      # a que termine el job mongo-init (condition: service_completed_successfully)
      test: ["CMD-SHELL", "mongosh --quiet --eval \"quit(db.adminCommand('ping').ok ? 0 : 1)\""]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

  # ---------------------------------------------------------------------------
  # 6. MONGO-INIT (inicializa el replica set, una sola vez)
  # ---------------------------------------------------------------------------
  # Patrón "job": entra, hace rs.initiate(), espera a que el nodo se elija
  # PRIMARY y termina. Idempotente: si ya está inicializado, no hace nada.
  mongo-init:
    image: mongo:8.0.32
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./docker/mongo-init.js:/mongo-init.js:ro   # montado solo lectura
    entrypoint: ["mongosh", "--host", "mongo", "--file", "/mongo-init.js"]
    restart: "no"                     # es un job: termina y no vuelve a correr

  # ---------------------------------------------------------------------------
  # 7. SERVICIOS NESTJS
  # ---------------------------------------------------------------------------
  # Todos se construyen con el mismo Dockerfile y se diferencian por APP.
  # No tienen container_name a propósito: así el escenario 4 de Fase 3 puede
  # hacer `docker compose up -d --scale billing-service=2`.
  #
  # Todos esperan a que los jobs de inicialización terminen bien:
  #   kafka-init → topics creados
  #   mongo-init → replica set con PRIMARY (necesario para transacciones)
  # ---------------------------------------------------------------------------
  activation-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: activation-api
    environment:
      KAFKA_BROKERS: kafka:19092          # listener INTERNAL, no localhost
      KAFKA_CLIENT_ID: activation-api
      KAFKA_GROUP_ID: activation-api
      MONGO_URI: "mongodb://mongo:27017/activation_api?replicaSet=rs0&directConnection=true"
      PORT: 3000
    ports:
      - "3000:3000"                       # único servicio con HTTP expuesto
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    init: true                            # PID 1 liviano: reenvía señales a Node
    restart: unless-stopped

  billing-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: billing-service
    environment:
      KAFKA_BROKERS: kafka:19092
      KAFKA_CLIENT_ID: billing-svc
      KAFKA_GROUP_ID: billing-svc
      MONGO_URI: "mongodb://mongo:27017/billing?replicaSet=rs0&directConnection=true"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped

  provisioning-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: provisioning-service
    environment:
      KAFKA_BROKERS: kafka:19092
      KAFKA_CLIENT_ID: provisioning-svc
      KAFKA_GROUP_ID: provisioning-svc
      MONGO_URI: "mongodb://mongo:27017/provisioning?replicaSet=rs0&directConnection=true"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: notification-service
    environment:
      KAFKA_BROKERS: kafka:19092
      KAFKA_CLIENT_ID: notification-svc
      KAFKA_GROUP_ID: notification-svc
      MONGO_URI: "mongodb://mongo:27017/notification?replicaSet=rs0&directConnection=true"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: no-reply@demo.local
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    init: true
    restart: unless-stopped
